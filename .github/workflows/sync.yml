name: Sync verified release
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homebrew-sync
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'RuiCostafrg/homebrew-tap' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.actor_id == '35194998')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.release.outputs.changed == 'true' && steps.pending.outputs.exists == 'false' }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find a newer stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/RuiCostafrg/typescript-crap/releases/latest > "$RUNNER_TEMP/release.json"
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          release = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'release.json').read_text())
          tag = release['tag_name']
          if release['draft'] or release['prerelease'] or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a stable SemVer tag')
          current = re.search(r'^  version "([0-9]+\.[0-9]+\.[0-9]+)"$', pathlib.Path('Formula/ts-crap.rb').read_text(), re.M)
          if current is None:
              raise SystemExit('Cannot read current formula version')
          newer = tuple(map(int, tag[1:].split('.'))) > tuple(map(int, current[1].split('.')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'tag={tag}', file=output)
              print(f'changed={str(newer).lower()}', file=output)
          PYTHON
      - name: Check for an existing update PR
        id: pending
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "releases/ts-crap-$TAG" --base main --state open --json number --jq length)
          if [[ "$existing" != 0 ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "An update PR for $TAG is already open; no duplicate needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify formula provenance and source identity
        if: steps.pending.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo RuiCostafrg/typescript-crap \
            --pattern ts-crap.rb --dir verified
          source_sha=$(gh api "repos/RuiCostafrg/typescript-crap/commits/$TAG" --jq .sha)
          gh attestation verify verified/ts-crap.rb --repo RuiCostafrg/typescript-crap \
            --signer-workflow RuiCostafrg/typescript-crap/.github/workflows/release.yml \
            --source-ref "refs/tags/$TAG" --source-digest "$source_sha" --deny-self-hosted-runners
          # Syntax checking happens without write credentials; never eval a formula.
          ruby -c verified/ts-crap.rb
          echo "Verified $TAG at $source_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pending.outputs.exists == 'false'
        with:
          name: verified-formula
          path: verified/ts-crap.rb
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: homebrew
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-formula
          path: verified
      - name: Open owner-reviewed formula update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          # Branch changes only. Protected main still requires owner merge.
          branch="releases/ts-crap-$TAG"
          base=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/Formula/ts-crap.rb" --jq .sha)
          content=$(base64 -w 0 verified/ts-crap.rb)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -X POST -f ref="refs/heads/$branch" -f sha="$base" --silent
          gh api "repos/$GITHUB_REPOSITORY/contents/Formula/ts-crap.rb" -X PUT \
            -f message="Update ts-crap to $TAG (verified provenance)" \
            -f sha="$sha" -f content="$content" -f branch="$branch" --silent
          cat > "$RUNNER_TEMP/body.md" <<'BODY'
          The read-only sync job verified this formula against the source release workflow, tag and commit using GitHub artifact attestations. Review the change and passing Tap CI before merging. This PR is created by the owner-approved homebrew environment job using a temporary token.
          BODY
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Update ts-crap to $TAG" --body-file "$RUNNER_TEMP/body.md"
          # Token-originated pushes do not start CI; dispatch the read-only checks.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  verify-dotnet-crap:
    if: >-
      github.repository == 'RuiCostafrg/homebrew-tap' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.actor_id == '35194998')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.release.outputs.changed == 'true' && steps.pending.outputs.exists == 'false' }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find a newer stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/RuiCostafrg/dotnet-crap --jq .full_name >/dev/null
          if ! gh api repos/RuiCostafrg/dotnet-crap/releases/latest > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.err"; then
            # Until the first dotnet-crap release, there is nothing to sync.
            grep -q 'HTTP 404' "$RUNNER_TEMP/release.err" || { cat "$RUNNER_TEMP/release.err" >&2; exit 1; }
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'dotnet-crap has no published release yet.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          release = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'release.json').read_text())
          tag = release['tag_name']
          if release['draft'] or release['prerelease'] or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a stable SemVer tag')
          formula = pathlib.Path('Formula/dotnet-crap.rb')
          current = re.search(r'^  version "([0-9]+\.[0-9]+\.[0-9]+)"$', formula.read_text(), re.M) if formula.exists() else None
          # Bootstrap: no formula yet, so the first stable release must be synced.
          changed = 'true' if current is None else \
              str(tuple(map(int, tag[1:].split('.'))) > tuple(map(int, current[1].split('.')))).lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'tag={tag}', file=output)
              print(f'changed={changed}', file=output)
          PYTHON
      - name: Check for an existing update PR
        id: pending
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "releases/dotnet-crap-$TAG" --base main --state open --json number --jq length)
          if [[ "$existing" != 0 ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'An update PR for this tag is already open; no duplicate needed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify formula provenance and source identity
        if: steps.pending.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo RuiCostafrg/dotnet-crap \
            --pattern dotnet-crap.rb --dir verified
          source_sha=$(gh api "repos/RuiCostafrg/dotnet-crap/commits/$TAG" --jq .sha)
          gh attestation verify verified/dotnet-crap.rb --repo RuiCostafrg/dotnet-crap \
            --cert-identity "https://github.com/RuiCostafrg/dotnet-crap/.github/workflows/release.yml@refs/tags/$TAG" \
            --source-ref "refs/tags/$TAG" --source-digest "$source_sha" --deny-self-hosted-runners
          # Syntax checking happens without write credentials; never eval a formula.
          ruby -c verified/dotnet-crap.rb
          echo "Verified dotnet-crap $TAG at $source_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pending.outputs.exists == 'false'
        with:
          name: verified-dotnet-crap-formula
          path: verified/dotnet-crap.rb
          if-no-files-found: error
          retention-days: 7

  publish-dotnet-crap:
    needs: verify-dotnet-crap
    if: needs.verify-dotnet-crap.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: homebrew
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-dotnet-crap-formula
          path: verified
      - name: Open owner-reviewed formula addition or update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-dotnet-crap.outputs.tag }}
        run: |
          branch="releases/dotnet-crap-$TAG"
          base=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          # Branch changes only. Protected main still requires owner merge.
          # A branch left by an earlier attempt (no open PR) is reset to main.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2>/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" -X PATCH -f sha="$base" -F force=true --silent
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -X POST -f ref="refs/heads/$branch" -f sha="$base" --silent
          fi
          # Bootstrap: Formula/dotnet-crap.rb does not exist yet, so the first
          # sync must create the file (contents PUT without sha) instead of
          # updating it (contents PUT with the existing blob's sha).
          fields=(-f content="$(base64 -w 0 verified/dotnet-crap.rb)" -f branch="$branch")
          if gh api "repos/$GITHUB_REPOSITORY/contents/Formula/dotnet-crap.rb?ref=main" --silent 2>/dev/null; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/Formula/dotnet-crap.rb?ref=main" --jq .sha)
            fields+=(-f sha="$sha")
            title="Update dotnet-crap to $TAG"
          else
            title="Add dotnet-crap $TAG"
          fi
          gh api "repos/$GITHUB_REPOSITORY/contents/Formula/dotnet-crap.rb" -X PUT \
            -f message="$title (verified provenance)" "${fields[@]}" --silent
          cat > "$RUNNER_TEMP/body.md" <<'BODY'
          The read-only sync job verified this dotnet-crap formula against the source release workflow, tag and commit using GitHub artifact attestations. Review the change and passing Tap CI before merging. This PR is created by the owner-approved homebrew environment job using a temporary token.
          BODY
          # Token-originated pushes do not start CI; dispatch the read-only checks
          # before opening the PR, so a failed dispatch is retried by the next sync.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "$title" --body-file "$RUNNER_TEMP/body.md"
