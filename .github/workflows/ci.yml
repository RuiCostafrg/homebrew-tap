name: Tap CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  workflows:
    if: >-
      github.repository == 'RuiCostafrg/homebrew-tap' &&
      (github.actor_id == '35194998' ||
       (github.actor == 'github-actions[bot]' && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/releases/ts-crap-v')))
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install checksum-pinned actionlint
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - run: ruby -c Formula/ts-crap.rb
  install:
    needs: workflows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, ubuntu-22.04]
    steps:
      - name: Test the exact proposed formula on a read-only runner
        shell: bash
        env:
          HOMEBREW_NO_ANALYTICS: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap RuiCostafrg/tap
          tap_dir=$(brew --repository RuiCostafrg/tap)
          git -C "$tap_dir" fetch origin "$GITHUB_SHA"
          git -C "$tap_dir" checkout --detach "$GITHUB_SHA"
          brew install RuiCostafrg/tap/ts-crap
          ts-crap --version
          ts-crap --help
