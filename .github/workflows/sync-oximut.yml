name: Sync verified Oximut release
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homebrew-sync-oximut
  cancel-in-progress: false
jobs:
  verify-oximut:
    if: >-
      github.repository == 'RuiCostafrg/homebrew-tap' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.actor_id == '35194998')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      attestations: read
    outputs:
      changed: ${{ steps.release.outputs.changed == 'true' && steps.pending.outputs.exists == 'false' }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find a newer stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/RuiCostafrg/oximut --jq .full_name >/dev/null
          if ! gh api repos/RuiCostafrg/oximut/releases/latest > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.err"; then
            # Until the first oximut release, there is nothing to sync.
            grep -q 'HTTP 404' "$RUNNER_TEMP/release.err" || { cat "$RUNNER_TEMP/release.err" >&2; exit 1; }
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'oximut has no published release yet.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          release = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'release.json').read_text())
          tag = release['tag_name']
          if release['draft'] or release['prerelease'] or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a stable SemVer tag')
          formula = pathlib.Path('Formula/oximut.rb')
          current = re.search(r'^  version "([0-9]+\.[0-9]+\.[0-9]+)"$', formula.read_text(), re.M) if formula.exists() else None
          # Bootstrap: no formula yet, so the first stable release must be synced.
          changed = 'true' if current is None else \
              str(tuple(map(int, tag[1:].split('.'))) > tuple(map(int, current[1].split('.')))).lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'tag={tag}', file=output)
              print(f'changed={changed}', file=output)
          PYTHON
      - name: Check for an existing update PR
        id: pending
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "releases/oximut-$TAG" --base main --state open --json number --jq length)
          if [[ "$existing" != 0 ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'An update PR for this tag is already open; no duplicate needed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify formula provenance and source identity
        if: steps.pending.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo RuiCostafrg/oximut \
            --pattern oximut.rb --dir verified
          source_sha=$(gh api "repos/RuiCostafrg/oximut/commits/$TAG" --jq .sha)
          gh attestation verify verified/oximut.rb --repo RuiCostafrg/oximut \
            --cert-identity "https://github.com/RuiCostafrg/oximut/.github/workflows/release.yml@refs/tags/$TAG" \
            --source-ref "refs/tags/$TAG" --source-digest "$source_sha" \
            --signer-digest "$source_sha" --deny-self-hosted-runners
          # Syntax checking happens without write credentials; never eval a formula.
          ruby -c verified/oximut.rb
          echo "Verified oximut $TAG at $source_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pending.outputs.exists == 'false'
        with:
          name: verified-oximut-formula
          path: verified/oximut.rb
          if-no-files-found: error
          retention-days: 7

  publish-oximut:
    needs: verify-oximut
    if: needs.verify-oximut.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: homebrew
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-oximut-formula
          path: verified
      - name: Open owner-reviewed formula addition or update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-oximut.outputs.tag }}
        run: |
          branch="releases/oximut-$TAG"
          base=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          # Branch changes only. Protected main still requires owner merge.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2>/dev/null; then
            echo "A previous sync left $branch. Review it before retrying." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -X POST -f ref="refs/heads/$branch" -f sha="$base" --silent
          # Bootstrap: Formula/oximut.rb does not exist yet, so the first
          # sync must create the file (contents PUT without sha) instead of
          # updating it (contents PUT with the existing blob's sha).
          fields=(-f content="$(base64 -w 0 verified/oximut.rb)" -f branch="$branch")
          if gh api "repos/$GITHUB_REPOSITORY/contents/Formula/oximut.rb?ref=main" --silent 2>/dev/null; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/Formula/oximut.rb?ref=main" --jq .sha)
            fields+=(-f sha="$sha")
            title="Update oximut to $TAG"
          else
            title="Add oximut $TAG"
          fi
          gh api "repos/$GITHUB_REPOSITORY/contents/Formula/oximut.rb" -X PUT \
            -f message="$title (verified provenance)" "${fields[@]}" --silent
          cat > "$RUNNER_TEMP/body.md" <<'BODY'
          The read-only sync job verified this oximut formula against the source release workflow, tag and commit using GitHub artifact attestations. Review the change and passing Tap CI before merging. This PR is created by the owner-approved homebrew environment job using a temporary token.
          BODY
          # Token-originated pushes do not start CI; dispatch the read-only checks
          # before opening the PR, so a failed dispatch is retried by the next sync.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "$title" --body-file "$RUNNER_TEMP/body.md"
